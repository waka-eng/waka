name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      preview_only:
        description: "Review the checked production SST diff without secrets, migrations, deploy or DNS changes"
        required: false
        default: false
        type: boolean
      release_legacy_alias:
        description: "Remove waka.im from the existing CloudFront distribution before deploying"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PNPM_VERSION: "9.12.0"
  NODE_VERSION: "24"

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    with:
      checkout_sha: ${{ github.sha }}

  deploy:
    needs: check
    if: ${{ needs.check.result == 'success' }}
    environment: production
    env:
      SST_STAGE: production
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_APP }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_APP }}
      PRODUCTION_DOMAIN: waka.im
      AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DB_CONNECTION_URL: ${{ secrets.DB_CONNECTION_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN_PRODUCTION }}
      VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST_PRODUCTION }}
      WAKA_OPENROUTER_DATA_COLLECTION: ${{ vars.WAKA_OPENROUTER_DATA_COLLECTION_PRODUCTION }}
      WAKA_OPENROUTER_REQUIRE_ZDR: ${{ vars.WAKA_OPENROUTER_REQUIRE_ZDR_PRODUCTION }}
      WAKA_OPERATIONS_ALERT_TOPIC_ARN: ${{ vars.WAKA_OPERATIONS_ALERT_TOPIC_ARN_PRODUCTION }}
      WAKA_ALERT_SNS_TOPIC_ARN: ${{ vars.WAKA_ALERT_SNS_TOPIC_ARN_PRODUCTION }}
    name: SST deploy waka.im
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify checked release commit before production operations
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          RELEASE_CHECK_RESULT: ${{ needs.check.result }}
        run: node scripts/verify-release-commit.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment environment
        env:
          WAKA_DISCORD_WEBHOOK_URL: ${{ secrets.WAKA_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            AWS_REGION
            AUTH_GOOGLE_ID
            AUTH_GOOGLE_SECRET
            AUTH_SECRET
            JWT_SECRET
            DB_CONNECTION_URL
            GEMINI_API_KEY
            OPENROUTER_API_KEY
            WAKA_DISCORD_WEBHOOK_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required production deployment environment: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Validate explicit stage options
        run: node scripts/validate-stage-options.mjs

      - name: Verify separate configured database targets
        env:
          DB_CONNECTION_URL: ${{ secrets.DB_CONNECTION_URL_DEV }}
          PRODUCTION_DB_CONNECTION_URL: ${{ secrets.DB_CONNECTION_URL }}
        run: node scripts/check-deployment-databases.mjs

      - name: Preserve current heartbeat action state before infrastructure update
        run: node scripts/monitoring-state.mjs >> "$GITHUB_ENV"

      - name: Preview checked production infrastructure
        if: ${{ inputs.preview_only }}
        env:
          SST_SECRET_OpenRouterApiKey: ${{ secrets.OPENROUTER_API_KEY }}
          SST_SECRET_DiscordWebhookUrl: ${{ secrets.WAKA_DISCORD_WEBHOOK_URL }}
        run: node scripts/preview-production.mjs

      - name: Save sanitized infrastructure preview
        if: ${{ inputs.preview_only && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-preview
          path: production-preview.json
          if-no-files-found: ignore

      - name: Release legacy CloudFront alias
        if: ${{ !inputs.preview_only && github.event_name == 'workflow_dispatch' && inputs.release_legacy_alias }}
        shell: bash
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          mapfile -t distribution_ids < <(
            aws cloudfront list-distributions \
              --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, '${PRODUCTION_DOMAIN}')].Id" \
              --output text | tr '\t' '\n' | sed '/^$/d'
          )

          if (( ${#distribution_ids[@]} == 0 )); then
            printf 'No existing CloudFront distribution currently owns %s.\n' "$PRODUCTION_DOMAIN"
            exit 0
          fi

          for distribution_id in "${distribution_ids[@]}"; do
            printf 'Removing %s from existing CloudFront distribution %s.\n' "$PRODUCTION_DOMAIN" "$distribution_id"
            aws cloudfront get-distribution-config --id "$distribution_id" > distribution.json
            etag="$(jq -r '.ETag' distribution.json)"
            jq --arg domain "$PRODUCTION_DOMAIN" '
              .DistributionConfig
              | .Aliases.Items = ((.Aliases.Items // []) | map(select(. != $domain)))
              | .Aliases.Quantity = (.Aliases.Items | length)
              | if .Aliases.Quantity == 0 then .Aliases |= del(.Items) else . end
            ' distribution.json > distribution-config.json
            aws cloudfront update-distribution \
              --id "$distribution_id" \
              --if-match "$etag" \
              --distribution-config file://distribution-config.json >/dev/null
            aws cloudfront wait distribution-deployed --id "$distribution_id"
          done

      - name: Set SST production secrets
        if: ${{ !inputs.preview_only }}
        env:
          WAKA_DISCORD_WEBHOOK_URL: ${{ secrets.WAKA_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm sst secret set GoogleClientId "$AUTH_GOOGLE_ID" --stage "$SST_STAGE"
          pnpm sst secret set GoogleClientSecret "$AUTH_GOOGLE_SECRET" --stage "$SST_STAGE"
          pnpm sst secret set SessionSecret "$AUTH_SECRET" --stage "$SST_STAGE"
          pnpm sst secret set JwtSecret "$JWT_SECRET" --stage "$SST_STAGE"
          pnpm sst secret set DbConnectionUrl "$DB_CONNECTION_URL" --stage "$SST_STAGE"
          pnpm sst secret set GeminiApiKey "$GEMINI_API_KEY" --stage "$SST_STAGE"
          pnpm sst secret set OpenRouterApiKey "$OPENROUTER_API_KEY" --stage "$SST_STAGE"
          printf '%s' "$WAKA_DISCORD_WEBHOOK_URL" | pnpm sst secret set DiscordWebhookUrl --stage "$SST_STAGE"

      - name: Apply production database migrations
        if: ${{ !inputs.preview_only }}
        run: pnpm db:migrate

      - name: Deploy SST production stage
        if: ${{ !inputs.preview_only }}
        run: pnpm sst deploy --stage "$SST_STAGE"

      - name: Connect Route53 production domain
        if: ${{ !inputs.preview_only }}
        shell: bash
        run: |
          set -euo pipefail

          distribution_domain="$(
            aws cloudfront list-distributions \
              --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, '${PRODUCTION_DOMAIN}')].DomainName | [0]" \
              --output text
          )"
          if [[ -z "$distribution_domain" || "$distribution_domain" == "None" ]]; then
            printf 'Could not find a CloudFront distribution for %s after deploy.\n' "$PRODUCTION_DOMAIN" >&2
            exit 1
          fi

          hosted_zone_id="$(
            aws route53 list-hosted-zones-by-name --dns-name "${PRODUCTION_DOMAIN}." \
              | jq -r --arg name "${PRODUCTION_DOMAIN}." '
                .HostedZones[]
                | select(.Name == $name and (.Config.PrivateZone | not))
                | .Id
              ' \
              | sed 's#^/hostedzone/##' \
              | head -n 1
          )"
          if [[ -z "$hosted_zone_id" ]]; then
            printf 'Could not find a public Route53 hosted zone for %s.\n' "$PRODUCTION_DOMAIN" >&2
            exit 1
          fi

          jq -n --arg domain "${PRODUCTION_DOMAIN}." --arg target "$distribution_domain" '{
            Changes: [
              {
                Action: "UPSERT",
                ResourceRecordSet: {
                  Name: $domain,
                  Type: "A",
                  AliasTarget: {
                    HostedZoneId: "Z2FDTNDATAQYW2",
                    DNSName: $target,
                    EvaluateTargetHealth: false
                  }
                }
              },
              {
                Action: "UPSERT",
                ResourceRecordSet: {
                  Name: $domain,
                  Type: "AAAA",
                  AliasTarget: {
                    HostedZoneId: "Z2FDTNDATAQYW2",
                    DNSName: $target,
                    EvaluateTargetHealth: false
                  }
                }
              }
            ]
          }' > route53-change-batch.json

          aws route53 change-resource-record-sets \
            --hosted-zone-id "$hosted_zone_id" \
            --change-batch file://route53-change-batch.json

      - name: Verify production runtime and cleanup wiring without secrets
        if: ${{ !inputs.preview_only }}
        run: node scripts/production-release-audit.mjs > production-release-audit.json

      - name: Arm missing-probe detection after natural healthy baseline
        if: ${{ !inputs.preview_only }}
        run: node scripts/initialize-monitoring.mjs > production-monitoring-baseline.json

      - name: Verify production monitoring isolation and delivery wiring
        if: ${{ !inputs.preview_only }}
        env:
          WAKA_DISCORD_WEBHOOK_URL: ${{ secrets.WAKA_DISCORD_WEBHOOK_URL }}
        run: node scripts/monitoring-audit.mjs > production-monitoring-audit.json

      - name: Save sanitized production acceptance
        if: ${{ !inputs.preview_only && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-release-audit
          path: |
            production-release-audit.json
            production-monitoring-audit.json
            production-monitoring-baseline.json
            production-monitoring-before.json
          if-no-files-found: ignore
