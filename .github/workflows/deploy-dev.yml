name: Deploy dev

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'docs/craft/evidence/**'
      - 'docs/goals/**'
      - 'docs/plans/**'
      - 'progress.txt'
  workflow_dispatch:
    inputs:
      verify_only:
        description: "Read-only dev runtime/log audit; skips deployment, migrations and secret updates"
        required: false
        default: false
        type: boolean
      audit_since:
        description: "Optional UTC start for read-only log coverage, within the last two hours"
        required: false
        default: ""
        type: string
      enable_conversation_replies:
        description: "Enable conversation replies on dev (off disables new dispatches; keeps saved messages)"
        required: false
        default: true
        type: boolean
      release_legacy_alias:
        description: "Remove dev.waka.im from the existing CloudFront distribution before deploying"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only == true && 'verify-dev' || 'deploy-dev' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Avoid GitHub's 2026 Node 20 actions-runtime deprecation warning while still
  # building the app itself with Node 20 below.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PNPM_VERSION: "9.12.0"
  NODE_VERSION: "20"
  # dev.waka.im is currently backed by the SST "development" stage.
  SST_STAGE: development
  AWS_REGION: us-west-2
  AWS_DEFAULT_REGION: us-west-2
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_APP }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_APP }}
  DB_CONNECTION_URL: ${{ secrets.DB_CONNECTION_URL_DEV }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  DEV_DOMAIN: dev.waka.im
  WAKA_CONVERSATION_REPLIES: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_conversation_replies == false && '0' || '1' }}

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only == true }}
    name: Read-only dev operational audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Inspect deployed settings and numeric logs only
        env:
          # Names verified from the development deployment outputs, not prod.
          WAKA_AUDIT_API_FUNCTION: waka-development-ApiFunction-efwcwxdn
          WAKA_AUDIT_WORKER_FUNCTION: waka-development-BackgroundWorkerFunction-xxbrbmcx
          WAKA_AUDIT_SINCE: ${{ inputs.audit_since }}
        run: |
          node scripts/dev-operations-audit.mjs > dev-operations.json
          node scripts/dev-source-policy.mjs > dev-source-policy.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-operations
          path: |
            dev-operations.json
            dev-source-policy.json
          if-no-files-found: error
          retention-days: 7
  deploy:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
    name: SST deploy dev.waka.im
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate AWS deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          required=(AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION OPENROUTER_API_KEY DB_CONNECTION_URL)
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required deployment environment: %s\n' "${missing[*]}" >&2
            printf 'Set repository secrets AWS_ACCESS_KEY_ID_APP and AWS_SECRET_ACCESS_KEY_APP.\n' >&2
            exit 1
          fi

      - name: Verify separate configured database targets
        env:
          # Read only in this preflight step, never used for a connection.
          PRODUCTION_DB_CONNECTION_URL: ${{ secrets.DB_CONNECTION_URL }}
        run: node scripts/check-deployment-databases.mjs

      - name: Release legacy CloudFront alias
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_legacy_alias) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release-dev-alias]')) }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t distribution_ids < <(
            aws cloudfront list-distributions \
              --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, '${DEV_DOMAIN}')].Id" \
              --output text | tr '\t' '\n' | sed '/^$/d'
          )

          if (( ${#distribution_ids[@]} == 0 )); then
            printf 'No existing CloudFront distribution currently owns %s.\n' "$DEV_DOMAIN"
            exit 0
          fi

          for distribution_id in "${distribution_ids[@]}"; do
            printf 'Removing %s from existing CloudFront distribution %s.\n' "$DEV_DOMAIN" "$distribution_id"
            aws cloudfront get-distribution-config --id "$distribution_id" > distribution.json
            etag="$(jq -r '.ETag' distribution.json)"
            jq --arg domain "$DEV_DOMAIN" '
              .DistributionConfig
              | .Aliases.Items = ((.Aliases.Items // []) | map(select(. != $domain)))
              | .Aliases.Quantity = (.Aliases.Items | length)
              | if .Aliases.Quantity == 0 then .Aliases |= del(.Items) else . end
            ' distribution.json > distribution-config.json
            aws cloudfront update-distribution \
              --id "$distribution_id" \
              --if-match "$etag" \
              --distribution-config file://distribution-config.json >/dev/null
            aws cloudfront wait distribution-deployed --id "$distribution_id"
          done

      - name: Clear stale SST development lock
        run: pnpm sst unlock --stage "$SST_STAGE"

      # SST secrets are stage-scoped. Keep the development key in step with the
      # repository secret before automatic and manually started deployments.
      - name: Set development OpenRouter secret
        run: pnpm sst secret set OpenRouterApiKey "$OPENROUTER_API_KEY" --stage "$SST_STAGE"

      # The migration runner and deployed functions must use the same target.
      - name: Set development database secret
        run: pnpm sst secret set DbConnectionUrl "$DB_CONNECTION_URL" --stage "$SST_STAGE"

      - name: Apply development database migrations
        # The prod workflow has always migrated; dev relied on hands. The gap
        # shipped a stage whose API had routes its database lacked tables for
        # (goal/principles cutover, 2026-08-21) — hence this step.
        run: pnpm db:migrate

      - name: Verify development memory schema
        run: node scripts/verify-memory-schema.mjs

      - name: Deploy SST development stage
        run: pnpm sst deploy --stage "$SST_STAGE"

      - name: Verify deployed chat configuration
        shell: bash
        run: |
          set -euo pipefail
          for output_key in apiFunctionName backgroundWorkerFunctionName; do
            function_name="$(jq -er --arg key "$output_key" '.[$key]' .sst/outputs.json)"
            configuration="$(aws lambda get-function-configuration --function-name "$function_name" \
              --query '{replies:Environment.Variables.WAKA_CONVERSATION_REPLIES,chatModel:Environment.Variables.WAKA_MODEL_CHAT,generationModel:Environment.Variables.OPENROUTER_GENERATION_MODEL,database:Environment.Variables.DB_CONNECTION_URL}' --output json)"
            jq -e --arg enabled "$WAKA_CONVERSATION_REPLIES" --arg database "$DB_CONNECTION_URL" \
              '.replies == $enabled and .chatModel == "deepseek/deepseek-v4.1-flash" and .generationModel == "deepseek/deepseek-v4.1-flash" and .database == $database' <<< "$configuration"
            printf '%s chat configuration and migrated database target verified.\n' "$output_key"
          done

      - name: Connect Route53 dev domain
        shell: bash
        run: |
          set -euo pipefail

          distribution_domain="$(
            aws cloudfront list-distributions \
              --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, '${DEV_DOMAIN}')].DomainName | [0]" \
              --output text
          )"
          if [[ -z "$distribution_domain" || "$distribution_domain" == "None" ]]; then
            printf 'Could not find a CloudFront distribution for %s after deploy.\n' "$DEV_DOMAIN" >&2
            exit 1
          fi

          hosted_zone_id="$(
            aws route53 list-hosted-zones-by-name --dns-name "waka.im." \
              | jq -r '
                .HostedZones[]
                | select(.Name == "waka.im." and (.Config.PrivateZone | not))
                | .Id
              ' \
              | sed 's#^/hostedzone/##' \
              | head -n 1
          )"
          if [[ -z "$hosted_zone_id" ]]; then
            printf 'Could not find a public Route53 hosted zone for waka.im.\n' >&2
            exit 1
          fi

          jq -n --arg domain "${DEV_DOMAIN}." --arg target "$distribution_domain" '{
            Changes: [
              {
                Action: "UPSERT",
                ResourceRecordSet: {
                  Name: $domain,
                  Type: "A",
                  AliasTarget: {
                    HostedZoneId: "Z2FDTNDATAQYW2",
                    DNSName: $target,
                    EvaluateTargetHealth: false
                  }
                }
              },
              {
                Action: "UPSERT",
                ResourceRecordSet: {
                  Name: $domain,
                  Type: "AAAA",
                  AliasTarget: {
                    HostedZoneId: "Z2FDTNDATAQYW2",
                    DNSName: $target,
                    EvaluateTargetHealth: false
                  }
                }
              }
            ]
          }' > route53-change-batch.json

          aws route53 change-resource-record-sets \
            --hosted-zone-id "$hosted_zone_id" \
            --change-batch file://route53-change-batch.json
