name: Deploy dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Avoid GitHub's 2026 Node 20 actions-runtime deprecation warning while still
  # building the app itself with Node 20 below.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PNPM_VERSION: "9.12.0"
  NODE_VERSION: "20"
  # dev.waka.im is currently backed by the SST "development" stage.
  SST_STAGE: development
  AWS_REGION: us-west-2
  AWS_DEFAULT_REGION: us-west-2
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_APP }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_APP }}

jobs:
  deploy:
    name: SST deploy dev.waka.im
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate AWS deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          required=(AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION)
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required deployment environment: %s\n' "${missing[*]}" >&2
            printf 'Set repository secrets AWS_ACCESS_KEY_ID_APP and AWS_SECRET_ACCESS_KEY_APP.\n' >&2
            exit 1
          fi

      - name: Deploy SST development stage
        run: pnpm sst deploy --stage "$SST_STAGE"
