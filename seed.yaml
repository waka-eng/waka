goal: >
  Convert the existing single-file index.html WAKA inspirations app into a fully working
  multi-user web application with a real PostgreSQL persistence layer, authenticated
  users, S3-backed attachments, and asynchronous Gemini-powered cluster classification.
  Decompose the monolithic index.html into a React component tree served via SST
  StaticSite, with a Hono API on Lambda and Drizzle ORM against the existing Neon
  Postgres database. The end-state must run locally via `sst dev`.

project_type: brownfield

constraints:
  - "Stack: SST (sst@v3) + Hono on Lambda + Vite + React 18 + React Router + Drizzle ORM"
  - "Database: Existing Neon PostgreSQL via DB_CONNECTION_URL in .env (do NOT provision a new one)"
  - "Auth: SST OpenAuth with email+password and Google OAuth using AUTH_SECRET / AUTH_GOOGLE_ID / AUTH_GOOGLE_SECRET / JWT_SECRET from .env"
  - "Storage: SST Bucket (S3) accessed via presigned PUT URLs; do NOT proxy file bytes through API"
  - "LLM: Gemini via GEMINI_API_KEY from .env (gemini-2.0-flash or equivalent)"
  - "Cluster classification: ASYNC only — POST /api/inspirations returns immediately; a Postgres-backed background_jobs worker runs Gemini classification and updates row"
  - "Frontend: Original 4282-line index.html MUST be decomposed into React components — no monolithic single-file shipped"
  - "Routing: React Router with /login route and / (authenticated) route; unauthenticated access to / redirects to /login"
  - "No mock SEED_INSPIRATIONS in production code path — users must be able to save real inspirations"
  - "Package manager: pnpm"
  - "TypeScript everywhere (frontend + backend + sst.config.ts)"
  - "Out of scope: AWS production deploy, email verification, password reset, Reflections AI auto-generation"
  - "Scope ends at: `sst dev` running locally with full end-to-end flow exercisable"

acceptance_criteria:
  - "User can sign up with email+password from /login page"
  - "User can sign in with Google OAuth from /login page"
  - "Unauthenticated visit to / redirects to /login"
  - "Authenticated user lands on / with original WAKA UI rendered from React components (visual parity with index.html — same fonts, colors, layout, animations)"
  - "User can capture a new inspiration with text + links + attachments and it persists to Neon Postgres"
  - "Attachments are uploaded directly to S3 via presigned URL flow, and S3 object keys are recorded in attachments table"
  - "Inspiration list view shows only the current user's saves (data isolation by user_id)"
  - "User can delete an inspiration"
  - "User can add a reflection (question + answer) to an inspiration; persists to reflections table"
  - "After save, a durable background_jobs row is enqueued; the classifier worker reads it, calls Gemini, and writes one of {outlier, bridge, morph, convergence, tension, loop} to inspirations.cluster"
  - "If Gemini returns nothing/invalid, cluster stays NULL — UI degrades gracefully"
  - "Drizzle migrations exist for users, inspirations, attachments, reflections; `pnpm db:push` (or migrate) creates them in Neon"
  - "vitest test suite covers: signup, login, inspiration CRUD, presigned URL issuance, classify queue handler (Gemini stubbed)"
  - "`pnpm dev` (or `sst dev`) starts the full stack locally and the flow above is observable in a browser"

ontology_schema:
  name: WakaInspirationDomain
  description: Multi-user inspirations capture with AI-clustered grouping and reflections
  fields:
    - name: User
      field_type: object
      description: "id (uuid), email (unique), password_hash (nullable for OAuth), google_id (nullable), name, created_at, updated_at"
    - name: Inspiration
      field_type: object
      description: "id (uuid), user_id (fk users), text (text), kind (string nullable), category (int nullable), cluster (enum nullable: outlier|bridge|morph|convergence|tension|loop), classified_at (timestamp nullable), created_at, updated_at"
    - name: Attachment
      field_type: object
      description: "id (uuid), inspiration_id (fk inspirations), type (enum: link|image|file), url (text), name (string nullable), s3_key (string nullable), created_at"
    - name: Reflection
      field_type: object
      description: "id (uuid), inspiration_id (fk inspirations), question (text), answer (text nullable), skipped (boolean default false), created_at"
    - name: ClusterEnum
      field_type: string
      description: "Allowed values: outlier, bridge, morph, convergence, tension, loop"

evaluation_principles:
  - name: end_to_end_works
    description: "Full user flow from signup → capture → list → classify is exercisable in `sst dev`"
    weight: 0.30
  - name: data_isolation
    description: "Every query reading or writing inspirations/attachments/reflections must be scoped by authenticated user_id; no cross-tenant leakage"
    weight: 0.20
  - name: visual_parity
    description: "React decomposition preserves the original index.html visual experience (fonts, animations, layout, cluster cards, capture modal, history sidebar)"
    weight: 0.15
  - name: async_correctness
    description: "Save returns immediately; classification happens in a DB-backed background worker; UI eventually reflects classified cluster"
    weight: 0.10
  - name: secret_hygiene
    description: "Secrets read only via SST Resource bindings or process.env, never committed beyond existing .env, never sent to client"
    weight: 0.10
  - name: type_safety
    description: "TypeScript strict mode passes; Drizzle schema types flow into Hono handlers and frontend"
    weight: 0.10
  - name: test_coverage
    description: "vitest suite green and covers critical API paths and background classifier handling"
    weight: 0.05

exit_conditions:
  - name: local_dev_stack_runs
    description: "local dev brings up the React app, Hono API, Bucket-backed attachment flow, DB-backed background jobs, and connects to Postgres"
    criteria: "Browser at sst dev URL renders /login, signup → list flow completes without errors"
  - name: schema_persisted
    description: "Drizzle migrations applied to Neon"
    criteria: "users / inspirations / attachments / reflections tables visible in Neon"
  - name: classification_loop_closed
    description: "An inspiration written without cluster is updated by worker within seconds"
    criteria: "Save inspiration → check DB row → cluster column eventually populated with valid enum"
  - name: tests_pass
    description: "All vitest tests pass"
    criteria: "pnpm test exits 0"

