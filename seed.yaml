# Waka — Inspiration & Context Engine
# Seed Specification v2.0
# Updated: 2026-04-12
# Architecture: LLM Wiki-style threads + bridges (replaces static clusters)

goal: >
  Build Waka, a personal knowledge engine inspired by the LLM Wiki pattern, deployed as a multi-user SaaS.
  Users throw things in (web PWA, CLI, URL import, voice, photo, AI conversations) and Waka's backend
  carefully places each capture into an evolving knowledge graph with three layers: raw inspirations,
  LLM-synthesized threads (living documents that get rewritten on each placement), and bridges
  (cross-thread connections). The frontend is a living, breathing canvas — threads appear as soft
  organic regions sized and colored by activity, bridges are expressed as spatial proximity,
  and unplaced captures float as dots that get absorbed into regions.
  Capture must feel as reliable and instant as Apple Notes; nothing typed should ever be lost.
  The floating capture island is always visible and supports conversational post-save reflection.
  Implement all 9 execution loops as defined in spec.md.

constraints:
  - "Next.js 15 (App Router), React 19, TypeScript, Tailwind CSS v4"
  - "Prisma ORM with Neon Serverless Postgres + pgvector extension"
  - "Auth.js v5 with Google OAuth provider (extensible for future providers)"
  - "SST Ion on AWS: Lambda + CloudFront + S3 Bucket + SQS Queue"
  - "Embeddings locked to OpenAI text-embedding-3-small (1536-dim) regardless of LLM_PROVIDER"
  - "Non-embedding LLM tasks (summarize, classify, title, thread synthesis, bridge detection) switchable via LLM_PROVIDER env var (openai | gemini)"
  - "SQS consumers run as Lambda subscribers (SST Queue -> Lambda trigger pattern)"
  - "AI field updates on frontend via polling at 3-second intervals (not SSE -- Lambda incompatible)"
  - "CLI OAuth uses localhost callback pattern (like gh auth login)"
  - "Offline queue uses last-write-wins strategy (no deduplication in V1)"
  - "Domain/URL derived from APP_URL environment variable (not hardcoded)"
  - "API key management (create/list/revoke) included in Loop 1 Foundation"
  - "All inspirations private by default -- no data shared without explicit user action"
  - "Eventual consistency on refresh -- no real-time sync required"
  - "Minimum valid rawContent: 1 character"
  - "Monorepo structure with pnpm workspaces + Turborepo"
  - "No budget constraints on infrastructure/API costs"
  - "Design must follow vendor-skills/taste-skill/SKILL.md -- intent-driven, anti-slop, premium craft"
  - "Light mode first, warm off-white background (stone-50), single desaturated warm accent, Geist typography"
  - "Two emotional modes coexist: capture mode (zero friction) and discovery mode (earned revelation)"
  - "Two views: Feed (home, wow cards + capture receipts) and Weave (ambient generative textile visualization)"
  - "Feed: two-tier hierarchy -- wow cards (prominent, full-width) + capture receipts (compact, one-line)"
  - "Weave: threads as strands, bridges as crossings, Canvas/WebGL with noise shaders -- no text, purely visual"
  - "Capture bar fixed at bottom of both views, expands to input sheet"
  - "Search inline at top of feed, filters semantically"
  - "Settings via avatar -> bottom sheet/modal, never a full page"
  - "Zero UI chrome: no section headers, no labels, no categories"
  - "Weave rendered via Canvas/WebGL with noise-based shaders for textile-like quality"
  - "Thread synthesis is a living document rewritten by LLM on each placement, not a static label"
  - "An inspiration can belong to multiple threads (many-to-many via ThreadInspiration join table)"
  - "Max 3 new bridges per thread placement to cap LLM costs"
  - "Bridge detection uses cosine similarity > 0.72 between thread centroids as pre-filter before LLM evaluation"

acceptance_criteria:
  # Loop 1: Foundation & Auth
  - "AC1.1: npm run dev starts without errors"
  - "AC1.2: Google OAuth sign-in creates User record in Neon"
  - "AC1.3: Unauthenticated /dashboard requests redirect to /auth/signin"
  - "AC1.4: Prisma schema migrates successfully (all models including Thread, Bridge, ApiKey)"
  - "AC1.5: pgvector extension enabled (vector type works)"
  - "AC1.6: SST dev mode boots and serves the app"
  - "AC1.7: S3 bucket provisioned and accessible"
  - "AC1.8: SQS queue provisioned with Lambda subscriber"
  - "AC1.9: Settings page allows creating/revoking API keys"
  - "AC1.10: API key Bearer auth works for API routes"

  # Loop 2: LLM Adapter & Embeddings
  - "AC2.1: LLMProvider interface implemented for OpenAI and Gemini"
  - "AC2.2: Embedding generated (1536-dim) and stored in DB"
  - "AC2.3: Cosine similarity search returns top-K nearest vectors"
  - "AC2.4: LLM_PROVIDER env var switches non-embedding tasks"
  - "AC2.5: Embeddings always use OpenAI regardless of LLM_PROVIDER"
  - "AC2.6: Summarize returns < 280 char summary"
  - "AC2.7: Title generation returns < 80 char title"
  - "AC2.8: Metadata classification returns valid domain/mood/actionability"
  - "AC2.9: 3x retry with exponential backoff on API failure"
  - "AC2.10: SQS Lambda consumer processes jobs from queue"

  # Loop 3: Core Capture API
  - "AC3.1: POST /api/inspirations returns 201 immediately (< 500ms)"
  - "AC3.2: Async pipeline populates all AI fields within 30s"
  - "AC3.3: Single-word inputs accepted and processed"
  - "AC3.4: GET list paginated (default 20, max 100), excludes soft-deleted"
  - "AC3.5: Semantic search returns relevant results"
  - "AC3.6: Users can only access their own inspirations"
  - "AC3.7: Deepen creates linked child and re-processes parent embedding"

  # Loop 4: Web App -- Feed + The Weave (Dual View)
  # Feed
  - "AC4.1: App opens to feed view with two-tier hierarchy: wow cards (prominent) + capture receipts (compact)"
  - "AC4.2: Thread wow cards show synthesis text large (pull-quote sized) + title, tap opens thread detail"
  - "AC4.3: Bridge wow cards show connection explanation + both thread titles"
  - "AC4.4: Capture receipts are compact one-liners between wow cards (raw text + timestamp)"
  - "AC4.5: Show/hide toggle for capture receipts -- default visible, toggle hides for wow-only feed"
  - "AC4.6: One inspiration can produce multiple wow cards when placed in multiple threads"
  - "AC4.7: Feed is reverse-chronological, paginated (default 20, infinite scroll)"
  # Capture
  - "AC4.8: Capture bar fixed at bottom on both feed and weave views"
  - "AC4.9: Capture bar expands to input sheet with text + voice + photo icons only"
  - "AC4.10: Text capture: type -> submit -> receipt appears at top of feed"
  - "AC4.11: URL auto-detection splits commentary + sourceUrl"
  - "AC4.12: Voice capture via MediaRecorder -> S3 -> transcription -> receipt in feed"
  - "AC4.13: Photo capture -> S3 -> LLM description/OCR -> receipt in feed"
  - "AC4.14: AI conversation import with focused summary -> receipt in feed"
  - "AC4.15: Post-save reflection appears in capture bar, auto-fades ~5s"
  - "AC4.16: Reflection answer saved as linked inspiration (parentId)"
  # Weave
  - "AC4.17: Weave has permanent loom structure -- subtle beautiful guide pattern always visible on canvas"
  - "AC4.18: Weave: raw fibers -- every unplaced inspiration visible as short faint warm stroke on loom"
  - "AC4.19: Weave: strands form when fibers coalesce into threads (visible transition)"
  - "AC4.20: Weave: strand thickness = inspiration count, color warmth = recency"
  - "AC4.21: Weave: bridge crossings visible as warm knots where strands intersect"
  - "AC4.22: Weave: strands follow noise-based flow fields for organic irregularity"
  - "AC4.23: Weave: no text anywhere -- purely visual, ambient art quality"
  - "AC4.24: Weave: deterministic strand paths (no jumping on re-render)"
  - "AC4.25: Weave: gentle breathing animation -- whole canvas subtly pulses"
  - "AC4.26: Weave: tap strand -> thread detail page"
  - "AC4.27: Weave: cold start is beautiful -- loom + scattered fibers, not blank canvas"
  # Shared
  - "AC4.28: Thread detail: full synthesis + composing inspirations, back returns to previous view"
  - "AC4.29: Search: inline on feed filters cards, on weave filters strands"
  - "AC4.30: Settings: avatar -> bottom sheet (mobile) or modal (desktop) with API keys, sign out"
  - "AC4.31: Offline capture: queued with sync indicator, auto-sync on reconnect"
  - "AC4.32: PWA installable on mobile Chrome/Safari"
  - "AC4.33: Responsive: feed and weave work on 375px through 1440px"
  - "AC4.34: Empty feed state: gentle prompt + capture bar ready"
  - "AC4.35: View switcher: bottom tab bar for feed <-> weave (no labels on tabs)"
  - "AC4.36: Zero UI chrome: no section headers, no labels, no categories"
  - "AC4.37: Light mode first: warm off-white background, Geist typography, no AI slop patterns"

  # Loop 5: CLI Tool
  - "AC5.1: waka-cli auth opens browser with localhost callback, stores token"
  - "AC5.2: WAKA_API_KEY env var works as auth fallback"
  - "AC5.3: Pipe text via stdin creates inspiration"
  - "AC5.4: Interactive prompt when no stdin detected"
  - "AC5.5: --file and --url flags work"
  - "AC5.6: Post-save reflection prompt with 60s timeout"
  - "AC5.7: Save feedback shows APP_URL-based link"

  # Loop 6: URL + AI Conversation Import
  - "AC6.1: URL fetch with @mozilla/readability + cheerio extraction"
  - "AC6.2: PDF text extraction via pdf-parse"
  - "AC6.3: OG metadata stored in sourceMeta"
  - "AC6.4: AI conversation summary used for embedding (not full transcript)"
  - "AC6.5: URL import timeout after 10s"

  # Loop 7: Synthesis Engine -- Thread Placement & Bridge Detection
  - "AC7.1: New inspiration triggers LLM-driven thread placement (many-to-many via ThreadInspiration)"
  - "AC7.2: Placement into existing thread rewrites synthesis document (not append)"
  - "AC7.3: New thread created when inspiration doesn't fit existing threads"
  - "AC7.4: Thread synthesis reads as coherent narrative, references older inspirations"
  - "AC7.5: Bridge detected between threads when new connection forms (max 3 per placement)"
  - "AC7.6: Bridge has meaningful AI-generated explanation referencing both threads"
  - "AC7.7: Empty threads soft-deleted when all inspirations removed"
  - "AC7.8: Thread title re-generated when synthesis changes significantly"
  - "AC7.9: Thread updatedAt touched on every re-synthesis (re-surfaces in feed)"

  # Loop 8: Adaptive Reflection
  - "AC8.1: Save always completes before reflection is shown"
  - "AC8.2: URL/link saves classified as NOT_NEEDED"
  - "AC8.3: Complex text classified as PROMPTED with contextual question"
  - "AC8.4: Reflection appears in floating capture island as conversational follow-up"
  - "AC8.5: Reflection auto-fades after ~5s if ignored"
  - "AC8.6: Reflection answer saved as linked inspiration and triggers re-embedding"
  - "AC8.7: Cold start phase (0-20 captures): reflection is primary post-capture response"

  # Loop 9: Shareable Cards & Threads
  - "AC9.1: Toggle isPublic generates unique shareSlug"
  - "AC9.2: Public page at /s/:slug renders without auth"
  - "AC9.3: Dynamic OG image generation via @vercel/og or Satori"
  - "AC9.4: Thread sharing shows synthesis + only public inspirations"

ontology_schema:
  name: WakaKnowledgeEngine
  description: >
    Domain model for a personal knowledge engine with three layers:
    raw inspirations (immutable captures), threads (LLM-synthesized living documents),
    and bridges (cross-thread connections). The frontend surfaces capture cards and
    discovery cards without exposing the underlying graph.
  fields:
    - name: User
      type: object
      description: "Authenticated user with Google OAuth. Has inspirations, threads, bridges, connections, and API keys."
    - name: Inspiration
      type: object
      description: "Core entity -- captured thought, URL, voice note, photo, or AI conversation. Contains rawContent, AI-generated fields (title, summary, tags, domain, mood, actionability, embedding), reflection state, sharing state, and threadId for placement."
    - name: Thread
      type: object
      description: "LLM-maintained living document. Has title and synthesis (rewritten on every new inspiration placement). Replaces the old static Cluster model."
    - name: Bridge
      type: object
      description: "Cross-thread connection with AI-generated explanation. Created when a new inspiration links two previously unrelated threads. Can be dismissed."
    - name: Connection
      type: object
      description: "AI-discovered link between two inspirations with similarity score and natural-language explanation."
    - name: ApiKey
      type: object
      description: "Hashed API key for CLI authentication. Created via settings page, validated via Bearer token."
    - name: SourceType
      type: string
      description: "Enum: CLI_CONVERSATION, VOICE_NOTE, TEXT_NOTE, URL_IMPORT, PHOTO, AI_CONVERSATION"
    - name: ReflectionStatus
      type: string
      description: "Enum: PENDING, PROMPTED, ANSWERED, SKIPPED, NOT_NEEDED"

evaluation_principles:
  - name: capture_reliability
    description: "Inspirations must never be silently lost. Offline queue, optimistic UI, and retry logic must guarantee persistence."
    weight: 1.0
  - name: capture_speed
    description: "POST /api/inspirations must return 201 within 500ms. AI processing is always async via SQS."
    weight: 0.9
  - name: thread_synthesis_quality
    description: "Thread synthesis must read as coherent narrative prose, not bullet lists. Must reference older inspirations contextually and evolve meaningfully on each placement."
    weight: 0.9
  - name: discovery_surprise
    description: "Discovery cards and thread syntheses must surface unexpected connections -- the 'oh, I didn't know these were related' moment is the core product value."
    weight: 0.9
  - name: design_craft
    description: "UI must follow taste-skill principles: intent-driven design, anti-slop, premium craft. Dark mode first, warm neutrals, no generic AI patterns."
    weight: 0.85
  - name: ux_capture_first
    description: "Floating capture island must be always visible, anchored to bottom viewport. Conversational post-save reflection must feel natural, not form-like."
    weight: 0.9
  - name: spec_fidelity
    description: "Implementation must match spec.md exactly -- no creative deviations, no missing features, no scope creep."
    weight: 1.0
  - name: security
    description: "Users can only access their own data. API keys are hashed. Auth middleware protects all routes."
    weight: 0.9
  - name: offline_resilience
    description: "PWA must work offline for capture. IndexedDB queue syncs on reconnection with last-write-wins."
    weight: 0.7

exit_conditions:
  - name: all_loops_complete
    description: "All 9 execution loops pass their acceptance criteria"
    criteria: "Every AC item verified via its specified test method"
  - name: deployment_working
    description: "SST deployment to AWS is functional"
    criteria: "sst deploy completes and app is accessible via CloudFront URL"
  - name: pwa_installable
    description: "Web app is installable as PWA on mobile"
    criteria: "Service worker registered, manifest present, Add to Home Screen prompt works"
  - name: cli_published
    description: "CLI tool is published and functional"
    criteria: "npx waka-cli auth + save + list works end-to-end"
  - name: thread_synthesis_working
    description: "Thread placement and synthesis rewriting produce coherent living documents"
    criteria: "Save 5 related inspirations -> thread forms -> synthesis weaves all 5 into narrative prose"
  - name: bridge_detection_working
    description: "Cross-thread bridges are detected and surfaced as discovery cards"
    criteria: "Save inspiration bridging two threads -> bridge created with explanation -> discovery card appears"

metadata:
  version: "2.0.0"
  updated_at: "2026-04-12T00:00:00Z"
  architecture: "LLM Wiki-style (raw inspirations -> threads -> bridges)"
  previous_version: "1.0.0 (static clusters + DBSCAN)"
  project_type: greenfield
  context_references:
    - path: "spec.md"
      role: primary
      summary: "Authoritative technical specification with 9 execution loops, three-layer architecture (inspirations/threads/bridges), data models, acceptance criteria, and test plans"
    - path: "vendor-skills/taste-skill/SKILL.md"
      role: design
      summary: "Intent-driven design engineering framework with anti-slop rules, typography standards, motion philosophy, and post-build evaluation"
    - path: "prd-initial-draft.md"
      role: reference
      summary: "Initial product requirements draft"
  resolved_ambiguities:
    - "SQS Consumer -> Lambda trigger (SST Queue subscriber)"
    - "AI field updates -> Polling at 3-second intervals"
    - "CLI OAuth -> Localhost callback pattern"
    - "Offline queue conflicts -> Last-write-wins (no dedup in V1)"
    - "Thread placement -> LLM-driven (not DBSCAN), synthesis rewritten on each placement"
    - "Bridge detection -> Cosine similarity > 0.72 pre-filter + LLM evaluation, max 3 per placement"
    - "Feed design -> Two card types (capture cards + discovery cards), no graph visualization"
    - "Capture bar -> Floating island at bottom viewport, conversational post-save reflection"
    - "Cold start -> Reflection as capture multiplier (0-20 captures), then threads/bridges take over"
    - "Domain -> APP_URL environment variable"
    - "API Key management -> Loop 1 Foundation (ApiKey model + settings page)"
