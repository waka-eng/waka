<!doctype html>
<!-- the shell is the world's own ground (founder, 2026-08-27: "loading page
     should be this black color") — inline so the first frame is black before
     any stylesheet arrives; every page then paints its own surface over it -->
<html lang="en" style="background: #06080d">
  <head>
    <meta charset="utf-8" />
    <title>WAKA — Inspirations</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300;1,9..144,400&display=swap"
      rel="stylesheet"
    />
    <!--
      TWO faces for the world, and the split is about script coverage, not taste.

      The archive is majority Korean and none of the five Latin families above
      cover Hangul, so a single sentence rendered Latin in the webfont and
      Korean in the system sans — a visible seam mid-sentence. The world uses
      only these two; the families above stay loaded for the surface routes.

        Pretendard (400, 500) — Latin AND Korean in one voice. Everything that
                                can contain user-captured text: body, archive,
                                UI, labels, meta, nav, form fields. The
                                default, and the answer whenever a role's
                                script is uncertain.
        Jost (300, 400, i300) — the voice face. A geometric in the Futura
                                line, which is where luxury sans lives. It
                                covers no Hangul, so it is restricted to
                                reliably-Latin roles: the generated ambition
                                (300) and headings / reading titles (400).
                                Never 500+.

      No third face in the world. If a role might hold Korean, it is Pretendard.
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;1,300&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
