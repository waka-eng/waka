<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAKA personal experience study</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;color:#e8edf4;background:#080a0e;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,select{min-height:44px}button{color:inherit;background:none;border:1px solid #343943;border-radius:12px;padding:10px 16px;cursor:pointer}button:hover{background:#252b35}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #cadcfb;outline-offset:3px}button:disabled{opacity:.55;cursor:default}.primary{background:#e2e8f2;color:#12161f;border-color:#e2e8f2}.primary:hover{background:#fff}.study{max-width:1120px;margin:0 auto;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:14px;color:#bdc4d1}.study label{display:flex;align-items:center;gap:8px}.study select{background:#171b23;color:#e8edf4;border:1px solid #343943;border-radius:8px;padding:8px}.study p{margin:0}.controls{display:flex;gap:12px;flex-wrap:wrap}.shell{max-width:1040px;min-height:680px;margin:0 auto 32px;background:radial-gradient(ellipse at 50% 18%,#192331 0%,#0d1118 44%,#090b0f 86%);border:1px solid #272c35;border-radius:24px;overflow:hidden}.topbar{padding:20px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff0c}.wordmark{letter-spacing:5px;font-size:14px}.topbar nav{display:flex;gap:8px}.topbar nav button{border:0;padding:10px 12px;color:#bcc4d1}.topbar nav .active{color:#fff;background:#ffffff0c}.content{max-width:740px;margin:auto;padding:34px 32px 48px}.eyebrow{font-size:14px;color:#aab7c9;letter-spacing:.08em;margin:0 0 16px}h1{font-size:32px;font-weight:400;line-height:1.35;margin:0 0 24px}h2{font-size:20px;font-weight:400;line-height:1.5;margin:0 0 16px}p{line-height:1.6}small,.muted{color:#b3bdca;font-size:14px;line-height:1.5}.hero{margin:12px 0 34px}.hero p{margin-bottom:20px}.orb{height:42px;width:42px;background:radial-gradient(circle at 35% 28%,#e6edf9,#8fa5c0 40%,#334358 72%);border-radius:50%;box-shadow:0 0 32px #9ebfed20;margin-bottom:28px}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}.section{border-top:1px solid #ffffff18;padding-top:26px;margin-top:30px}.row{display:flex;gap:16px;align-items:flex-start;padding:18px 0;border-bottom:1px solid #ffffff12}.number{color:#98a8bd;font-size:14px;padding-top:4px}.row .body{flex:1}.row p{margin:0 0 4px}.row button{flex-shrink:0}.sheet{background:#11161e;border:1px solid #2b3442;border-radius:20px;padding:28px}.sheet .heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.heading h1{margin:0;font-size:24px}.heading button{border:0}textarea{width:100%;min-height:150px;resize:vertical;line-height:1.6;border:0;border-bottom:1px solid #495360;color:inherit;background:transparent;padding:12px 0;font-size:16px}input{width:100%;border:1px solid #4a5462;border-radius:10px;padding:12px;background:#0c1118;color:inherit;min-height:44px}.media{display:flex;align-items:center;gap:14px;border:1px solid #323d4c;border-radius:12px;padding:12px;margin:14px 0}.media .body{flex:1;min-width:0}.media p{margin:0;overflow-wrap:anywhere}.thumb{height:56px;width:64px;border-radius:8px;background:linear-gradient(145deg,#5e6e73,#303b49);display:grid;place-items:center;color:#e1e7e8;font-size:14px}.media button{padding:8px;border:0}.notice{padding:12px 16px;background:#263145;border-radius:10px;line-height:1.5;margin:16px 0}.notice.error{background:#39292b;color:#f1d4d0}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tools button{font-size:14px}.footer{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:24px}.review-image{height:170px;background:linear-gradient(135deg,#3c4f5d 0%,#81969a 49%,#2c3946 50%,#45535e 100%);border-radius:12px;margin:16px 0}.review-text{font-size:23px;line-height:1.5}.share-card{background:#dae1e9;color:#182332;border-radius:18px;min-height:280px;padding:36px;display:flex;flex-direction:column;justify-content:space-between;margin:20px 0}.share-card blockquote{font-size:29px;line-height:1.4;margin:20px 0}.share-card small{color:#3c4a5e}.chat{display:flex;flex-direction:column;gap:20px}.message{max-width:92%;line-height:1.65}.message.user{align-self:flex-end;background:#263246;padding:14px 18px;border-radius:16px}.refs{font-size:14px;border-top:1px solid #354252;margin-top:12px;padding-top:10px;color:#bccbdf}.empty{padding:36px 0}.capture-shortcut{display:block;margin:28px auto 0}.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#b9c9df;margin-right:8px}.review-steps{display:flex;justify-content:space-between;font-size:14px;color:#b3bdca}.small-button{font-size:14px}.back{border:0;padding-left:0;margin-bottom:18px}.detail-quote{font-size:23px;line-height:1.55}.spacer{margin-top:26px}
@media(max-width:600px){.study{padding:12px}.controls{width:100%}.study label{flex:1}.study select{max-width:100%;flex:1;min-width:0}.shell{margin:0;border-radius:0;border-left:0;border-right:0;min-height:calc(100dvh - 120px)}.topbar{padding:16px}.topbar nav{gap:0}.topbar nav button{font-size:14px;padding:10px}.wordmark{letter-spacing:3px}.content{padding:26px 20px 36px}h1{font-size:27px}.sheet{padding:20px}.footer{align-items:stretch;flex-direction:column}.footer .actions{margin-top:0}.footer .primary{flex:1}.share-card{padding:24px}.share-card blockquote{font-size:25px}.row{gap:10px}.row button{padding:8px}.review-text,.detail-quote{font-size:21px}}
</style></head>
<body>
<div class="study"><p>WAKA · Design study · Example content</p><div class="controls"><label>Screen <select id="screen"><option value="home">Home</option><option value="capture">Capture</option><option value="detail">Inspiration</option><option value="review">Review</option><option value="principle">Principle & share</option><option value="avatar">Avatar</option></select></label><label>State <select id="state"><option value="ready">Ready</option><option value="empty">First visit / empty</option><option value="loading">Loading</option><option value="saving">Saving</option><option value="error">Failed</option><option value="returning">Returning</option></select></label></div></div>
<main class="shell"><header class="topbar"><span class="wordmark">WAKA</span><nav aria-label="Main"><button data-go="home">Me</button><button data-go="review">Review</button><button data-go="avatar">Avatar</button></nav></header><div id="content" class="content"></div></main>
<script>
const screenSelect=document.getElementById('screen'),stateSelect=document.getElementById('state'),content=document.getElementById('content');
let draft='The room had space to breathe. I want to leave more of that in my own work.',clip=false,photo=true,link=true,position=1,answer='',sharing=false,shareWords='Leave room for what matters.';
const safe=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function go(screen,state='ready',replace=false){const hash=new URLSearchParams({screen,state}).toString();history[replace?'replaceState':'pushState'](null,'','#'+hash);render();}
function media(){return `${photo?'<div class="media"><div class="thumb">Photo</div><div class="body"><p>A room with space</p><small>Photo attached</small></div><button data-action="photo" aria-label="Remove photo">×</button></div>':''}${link?'<div class="media"><div class="thumb">Link</div><div class="body"><p>Leaving room for the unexpected</p><small>example.com · Link</small></div><button data-action="link" aria-label="Remove link">×</button></div>':''}${clip?'<div class="media"><div class="thumb">Voice</div><div class="body"><p>Recording · 0:30</p><small>Ready to save</small></div><button data-action="record">Record again</button></div>':''}`;}
function notice(state,subject='Your words'){return state==='loading'?'<p role="status"><span class="pulse"></span>Opening…</p>':state==='saving'?`<p role="status" class="notice">${subject} are being saved…</p>`:state==='error'?`<div role="alert" class="notice error">Couldn’t finish saving. Your draft is here.<div class="actions"><button data-action="retry">Try again</button></div></div>`:state==='returning'?'<p class="notice">Continue where you left off.</p>':'';}
function home(state){if(state==='empty')return `<div class="empty"><div class="orb"></div><p class="eyebrow">Your space</p><h1>Keep something that stays with you.</h1><p class="muted">A thought, photo, link or recording.</p><button class="primary" data-go="capture">Capture inspiration</button></div><section class="section"><h2>Principles</h2><p class="muted">Your choices will become clearer as you keep and revisit what matters.</p></section>`;
return `${notice(state)}<section class="hero"><div class="orb"></div><p class="eyebrow">Top of mind</p><h1>You’re making more room for the work you care about.</h1><p class="muted">Recently, space has meant fewer commitments as much as a quieter place.</p><div class="actions"><button data-go="detail">What this grew from</button><button class="primary" data-go="review">Review 5 inspirations</button></div></section><section class="section"><div class="heading"><h2>Principles</h2></div><div class="row"><span class="number">01</span><div class="body"><p>Leave room for what matters.</p><small>Seen in how you choose your time and work.</small></div><button data-go="principle" aria-label="Open principle">↗</button></div><div class="row"><span class="number">02</span><div class="body"><p>Try a small version before committing.</p><small>Grounded in experiences you kept.</small></div><button data-go="principle" aria-label="Open another principle">↗</button></div></section><button class="capture-shortcut" data-go="capture">＋ Capture inspiration</button>`;}
function capture(state){const value=state==='empty'?'':draft;return `<section class="sheet"><div class="heading"><h1>Capture inspiration</h1><button data-go="home">Close</button></div><textarea id="draft" aria-label="Inspiration" placeholder="A thought, link, photo or recording…">${safe(value)}</textarea><div class="tools"><button data-action="photo">＋ Photo</button><button data-action="link">＋ Link</button><button data-action="record">● Record</button></div>${state==='empty'?'':media()}${notice(state)}<div class="footer"><small>Private · Your space</small><div class="actions"><button data-action="save" ${state==='saving'||state==='empty'?'disabled':''}>Save</button><button class="primary" data-action="reflect" ${state==='saving'||state==='empty'?'disabled':''}>Save & think further</button></div></div></section>`;}
function detail(state){return `<button class="back" data-go="home">← Back</button><p class="eyebrow">October 2 · Inspiration</p>${notice(state)}${state==='empty'?'<h1>This inspiration is no longer available.</h1>':`<p class="detail-quote">${safe(draft)}</p><div class="review-image" role="img" aria-label="Example photo composition"></div><p class="muted">Photo · Link${clip?' · Recording':''}</p><section class="section"><h2>Your reflection</h2><p>What would making room look like in your work?</p>${answer?`<p>${safe(answer)}</p><button data-action="reflect">Think further</button>`:`<textarea id="answer" aria-label="Your reflection" placeholder="In your own words…"></textarea><div class="actions"><button class="primary" data-action="answer">Continue →</button><button data-go="home">Done for now</button></div>`}</section>`}`;}
function review(state){if(state==='empty')return `<div class="empty"><div class="orb"></div><h1>You’ve revisited what’s here.</h1><p class="muted">Keep something new, or choose an earlier inspiration.</p><div class="actions"><button class="primary" data-go="capture">Capture inspiration</button><button data-go="detail">Open an inspiration</button></div></div>`;return `<button class="back" data-go="home">← Close review</button><div class="review-steps"><span>Review</span><span>${position} of 5</span></div>${notice(state)}<div class="review-image" role="img" aria-label="Example inspiration photo"></div><p class="review-text">${position<3?'The room had space to breathe.':'A small experiment made the next choice feel clearer.'}</p><p class="muted">Saved this week · Reflected</p><button class="small-button" data-go="detail">Open inspiration</button><div class="actions"><button data-action="skip">Pass for now</button><button class="primary" data-action="keep">Still speaks to me</button><button data-action="back">Previous</button></div>${position>=3?'<section class="section"><h2>You kept coming back to room to choose.</h2><p>Where do you want more of that right now?</p><textarea id="answer" aria-label="Review reflection" placeholder="In your own words…"></textarea><div class="actions"><button class="primary" data-action="finish">Keep this thought</button><button data-go="home">Finish for now</button></div></section>':''}`;}
function principle(state){if(state==='empty')return '<h1>Your principles will form here.</h1><p class="muted">Start with something that matters to you.</p><button class="primary" data-go="capture">Capture inspiration</button>';return `<button class="back" data-go="home">← My principles</button><p class="eyebrow">Principle</p><h1>Leave room for what matters.</h1><p class="muted">You return to this when choosing your time, surroundings and work.</p>${notice(state)}<div class="actions"><button data-go="detail">Why this fits</button><button data-go="avatar">Talk about this</button><button class="primary" data-action="share">Make a card</button></div>${sharing?`<section class="section"><h2>Your share card</h2><label for="wording" class="muted">Words for this card</label><input id="wording" value="${safe(shareWords)}"><div class="share-card"><small>MY PRINCIPLES</small><blockquote id="card-words">${safe(shareWords)}</blockquote><small>WAKA</small></div><div class="actions"><button data-action="export">Save image</button><button class="primary" data-action="export">Share</button></div></section>`:''}`;}
function avatar(state){return `<p class="eyebrow">Your avatar</p><div class="orb"></div>${state==='empty'?'<h1>What’s on your mind?</h1><p class="muted">We can start with something you’ve kept, or a choice you’re facing.</p>':'<h1>Think it through.</h1><div class="chat"><div class="message user">Should I take on this new project?</div><div class="message">You’ve been trying to leave room for work that matters. What would taking this on make less room for?<div class="refs">Using: Leave room for what matters.</div></div></div>'}${notice(state,'Your message')}<div class="spacer"><textarea id="answer" aria-label="Message to your avatar" placeholder="Tell me what you’re considering…">${state==='returning'?safe(answer):''}</textarea><div class="actions"><button class="primary" data-action="chat">Send</button><button data-go="capture">Keep a thought</button></div></div>`;}
function render(){const p=new URLSearchParams(location.hash.slice(1));const screen=['home','capture','detail','review','principle','avatar'].includes(p.get('screen'))?p.get('screen'):'home';const state=['ready','empty','loading','saving','error','returning'].includes(p.get('state'))?p.get('state'):'ready';screenSelect.value=screen;stateSelect.value=state;document.querySelectorAll('.topbar button').forEach(b=>b.classList.toggle('active',b.dataset.go===screen));content.innerHTML=({home,capture,detail,review,principle,avatar}[screen])(state);}
screenSelect.addEventListener('change',()=>go(screenSelect.value,stateSelect.value));stateSelect.addEventListener('change',()=>{if(screenSelect.value==='capture'&&stateSelect.value==='empty'){draft='';photo=false;link=false;clip=false;}go(screenSelect.value,stateSelect.value);});window.addEventListener('popstate',render);
document.addEventListener('input',event=>{if(event.target.id==='draft'){draft=event.target.value;content.querySelectorAll('[data-action="save"],[data-action="reflect"]').forEach(button=>button.disabled=!draft.trim()&&stateSelect.value==='empty');}if(event.target.id==='answer')answer=event.target.value;if(event.target.id==='wording'){shareWords=event.target.value;document.getElementById('card-words').textContent=shareWords;}});
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return;}const action=b.dataset.action;if(action==='photo'){photo=!photo;go('capture');}if(action==='link'){link=!link;go('capture');}if(action==='record'){clip=true;go('capture');}if(action==='save'){go('home','returning');}if(action==='reflect'){go('detail');}if(action==='answer'){go('detail','returning');}if(action==='keep'||action==='skip'){position=Math.min(5,position+1);render();}if(action==='back'){position=Math.max(1,position-1);render();}if(action==='finish'){go('home','returning');}if(action==='share'){sharing=true;render();}if(action==='export'){go('principle','returning');}if(action==='retry'){go(screenSelect.value,'saving');}if(action==='chat'){go('avatar','returning');}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){go('home');}if((event.ctrlKey||event.metaKey)&&event.key==='Enter'&&!event.isComposing){event.preventDefault();go(screenSelect.value==='capture'?'home':'detail','returning');}});
render();
</script></body></html>
